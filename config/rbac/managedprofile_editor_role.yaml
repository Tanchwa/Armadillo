# This rule is not used by the project armadillo itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the armadillo.andrewsutliff.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: armadillo
    app.kubernetes.io/managed-by: kustomize
  name: managedprofile-editor-role
rules:
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - managedprofiles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - managedprofiles/status
  verbs:
  - get
