# This rule is not used by the project armadillo itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over armadillo.andrewsutliff.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: armadillo
    app.kubernetes.io/managed-by: kustomize
  name: demotionpolicy-admin-role
rules:
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - demotionpolicies
  verbs:
  - '*'
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - demotionpolicies/status
  verbs:
  - get
