---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - demotionpolicies
  - managedprofiles
  - profilebindings
  - profilenodestatuses
  - promotionpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - demotionpolicies/finalizers
  - managedprofiles/finalizers
  - profilebindings/finalizers
  - profilenodestatuses/finalizers
  - promotionpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - demotionpolicies/status
  - managedprofiles/status
  - profilebindings/status
  - profilenodestatuses/status
  - promotionpolicies/status
  verbs:
  - get
  - patch
  - update
