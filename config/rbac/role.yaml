---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - managedprofiles
  - promotionpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - managedprofiles/finalizers
  - promotionpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - managedprofiles/status
  - promotionpolicies/status
  verbs:
  - get
  - patch
  - update
