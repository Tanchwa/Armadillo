# This rule is not used by the project armadillo itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to armadillo.andrewsutliff.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: armadillo
    app.kubernetes.io/managed-by: kustomize
  name: profilenodestatus-viewer-role
rules:
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - profilenodestatuses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - profilenodestatuses/status
  verbs:
  - get
