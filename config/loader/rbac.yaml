# Hand-written: controller-gen only generates the manager's role. Keep
# +kubebuilder:rbac markers out of loader code so they don't leak into it.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: armadillo
    app.kubernetes.io/managed-by: kustomize
  name: loader
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: armadillo
    app.kubernetes.io/managed-by: kustomize
  name: loader-role
rules:
# Read the profiles to load. The loader never writes ManagedProfiles: it does
# not decide, it applies.
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - managedprofiles
  verbs:
  - get
  - list
  - watch
# Report what is loaded on this node.
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - profilenodestatuses
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - profilenodestatuses/status
  verbs:
  - get
  - update
  - patch
# No access to nodes: a loader that could patch nodes could cordon or relabel
# any node in the cluster. The loaded hash is reported in ProfileNodeStatus,
# and node_restriction.yaml limits each loader to its own node's objects.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: armadillo
    app.kubernetes.io/managed-by: kustomize
  name: loader-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loader-role
subjects:
- kind: ServiceAccount
  name: loader
  namespace: system
