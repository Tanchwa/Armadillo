---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: managedprofiles.armadillo.andrewsutliff.com
spec:
  group: armadillo.andrewsutliff.com
  names:
    kind: ManagedProfile
    listKind: ManagedProfileList
    plural: managedprofiles
    singular: managedprofile
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ManagedProfile is the Schema for the managedprofiles API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ManagedProfile
            properties:
              demotionPolicyRef:
                description: DemotionPolicyRef is a reference to the DemotionPolicy
                  resource that defines the demotion lifecycle for this ManagedProfile.
                properties:
                  apiVersion:
                    description: APIVersion is the API version of the PromotionPolicy
                      resource.
                    type: string
                  kind:
                    description: Kind is the kind of the PromotionPolicy resource.
                    type: string
                  name:
                    description: |-
                      Name is the name of the PromotionPolicy resource.
                      The policy must be in the same namespace as the ManagedProfile: a cross-namespace
                      reference would let one namespace promote or demote another namespace's profile.
                    type: string
                required:
                - name
                type: object
              gitOptions:
                description: GitOptions defines the Git repository and branch to use
                  for this ManagedProfile.
                properties:
                  branch:
                    description: Branch is the branch to read the profile from. Empty
                      means the repository's default branch.
                    maxLength: 255
                    type: string
                  openPR:
                    description: OpenPR indicates whether to open a pull request for
                      changes to the ManagedProfile.
                    type: boolean
                  path:
                    description: Path is the path of the profile file within the repository.
                    maxLength: 1024
                    minLength: 1
                    type: string
                  prBody:
                    description: PRBody is the body of the pull request to open for
                      changes to the ManagedProfile.
                    type: string
                  prTitle:
                    description: PRTitle is the title of the pull request to open
                      for changes to the ManagedProfile.
                    type: string
                  repositorySecret:
                    description: |-
                      RepositorySecret is a reference to a Kubernetes Secret that contains the credentials, url, and other information for accessing the Git repository.
                      We use LocalObjectReference here to avoid the need for a full Secret reference, since we want to restrict to secrets in the same namespace as the ManagedProfile.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - path
                - repositorySecret
                type: object
              promotionPolicyRef:
                description: PromotionPolicyRef is a reference to the PromotionPolicy
                  resource that defines the promotion lifecycle for this ManagedProfile.
                properties:
                  apiVersion:
                    description: APIVersion is the API version of the PromotionPolicy
                      resource.
                    type: string
                  kind:
                    description: Kind is the kind of the PromotionPolicy resource.
                    type: string
                  name:
                    description: |-
                      Name is the name of the PromotionPolicy resource.
                      The policy must be in the same namespace as the ManagedProfile: a cross-namespace
                      reference would let one namespace promote or demote another namespace's profile.
                    type: string
                required:
                - name
                type: object
            type: object
          status:
            description: status defines the observed state of ManagedProfile
            properties:
              available:
                description: The profile is installed on the target system and is
                  ready for use by consumers.
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the ManagedProfile resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              demoting:
                description: profile has passed the demotion threshold and is in the
                  process of being demoted and removed from the target system.
                type: string
              enforcementLevel:
                description: EnforcementLevel indicates that the enforcement level
                  of the ManagedProfile is set to "Enforce" or "Inform".
                type: string
              probation:
                description: |-
                  Probation indicates whether the profile is on probation after a promotion,
                  as defined by the probation of its DemotionPolicy. It is empty when the profile
                  has not been promoted or has no DemotionPolicy.
                enum:
                - Active
                - Completed
                type: string
              processing:
                description: |-
                  profile is in the process of being installed on the target system.
                  either the profile is being installed for the first time, or it is being reinstalled due to a change in the profile.
                type: string
              profile:
                description: |-
                  Profile is the profile the manager last fetched from git and validated.
                  Loaders load this and nothing else, so they never need repository credentials.
                properties:
                  content:
                    description: |-
                      Content is the profile text exactly as committed. The loader does not load it
                      as written: it sets the profile name and mode itself.
                    maxLength: 262144
                    type: string
                  hash:
                    description: |-
                      Hash is the hash of content, as "sha256:<hex>". A loader reports this value
                      back in ProfileNodeStatus once it has loaded the profile.
                    maxLength: 128
                    type: string
                  revision:
                    description: Revision is the git commit the content was read from.
                    maxLength: 64
                    type: string
                required:
                - content
                - hash
                type: object
              promoting:
                description: profile has passed the promotion threshold and is in
                  the pocess of being promoted and committed back to the source repository.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
