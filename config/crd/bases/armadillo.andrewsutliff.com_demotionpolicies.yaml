kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: demotionpolicies.armadillo.andrewsutliff.com
spec:
  group: armadillo.andrewsutliff.com
  names:
    kind: DemotionPolicy
    listKind: DemotionPolicyList
    plural: demotionpolicies
    singular: demotionpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DemotionPolicy is the Schema for the demotionpolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DemotionPolicy
            properties:
              demotionRules:
                description: |-
                  DemotionRules is a list of demotion rules that define the demotion policy
                  Demoting refers to moving a profile from AppArmor enforce mode back to complain mode.
                  Demotion applies to every node at once: a denial on one node is evidence the profile
                  is wrong for the workload, not for that node.
                  While the profile is on probation, a matching rule demotes it. After probation,
                  a matching rule triggers probation.afterProbation.
                items:
                  properties:
                    requirements:
                      description: requirements are ANDed. Rules in demotionRules
                        are ORed.
                      items:
                        properties:
                          key:
                            enum:
                            - DenialsObserved
                            - NodesWithDenials
                            type: string
                          operator:
                            enum:
                            - In
                            - NotIn
                            - Exists
                            - DoesNotExist
                            - Gt
                            - Lt
                            type: string
                          values:
                            items:
                              maxLength: 63
                              type: string
                            maxItems: 16
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - key
                        - operator
                        type: object
                        x-kubernetes-validations:
                        - message: Gt and Lt take exactly one integer value
                          rule: '!(self.operator in [''Gt'',''Lt'']) || (size(self.values)
                            == 1 && self.values[0].matches(''^[0-9]+$''))'
                        - message: In and NotIn take at least one value
                          rule: '!(self.operator in [''In'',''NotIn'']) || size(self.values)
                            > 0'
                        - message: Exists and DoesNotExist take no values
                          rule: '!(self.operator in [''Exists'',''DoesNotExist''])
                            || !has(self.values)'
                      maxItems: 16
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - requirements
                  type: object
                maxItems: 16
                minItems: 1
                type: array
              probation:
                description: |-
                  Probation defines the period after a promotion during which the profile is demoted
                  automatically, and what happens once that period is over.
                  A denial is both what a too-narrow profile produces and what a blocked attack produces.
                  Demoting automatically forever would let an attacker switch enforcement off by
                  triggering one denial, so automatic demotion is limited to probation.
                properties:
                  afterProbation:
                    default: Alert
                    description: AfterProbation is what happens when a demotion rule
                      matches after probation.
                    enum:
                    - Alert
                    - Demote
                    type: string
                  requirements:
                    description: |-
                      Requirements define when the profile is on probation: it is on probation while
                      every requirement holds, and leaves probation the first time one does not.
                      Requirements count events observed since the promotion, never elapsed time,
                      for the same reason promotion is not gated on a silence timer.
                    items:
                      properties:
                        key:
                          description: ProbationKey names a count of events observed
                            since the profile was promoted.
                          enum:
                          - DeploysSincePromotion
                          - RestartsSincePromotion
                          - BusinessCyclesSincePromotion
                          type: string
                        operator:
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                          - Gt
                          - Lt
                          type: string
                        values:
                          items:
                            maxLength: 63
                            type: string
                          maxItems: 16
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                      x-kubernetes-validations:
                      - message: Gt and Lt take exactly one integer value
                        rule: '!(self.operator in [''Gt'',''Lt'']) || (size(self.values)
                          == 1 && self.values[0].matches(''^[0-9]+$''))'
                      - message: In and NotIn take at least one value
                        rule: '!(self.operator in [''In'',''NotIn'']) || size(self.values)
                          > 0'
                      - message: Exists and DoesNotExist take no values
                        rule: '!(self.operator in [''Exists'',''DoesNotExist'']) ||
                          !has(self.values)'
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - requirements
                type: object
            required:
            - demotionRules
            - probation
            type: object
          status:
            description: status defines the observed state of DemotionPolicy
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the DemotionPolicy resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
