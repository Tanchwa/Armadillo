apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: armadillo
    app.kubernetes.io/managed-by: kustomize
  name: webhook-service
  namespace: system
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  # The webhook Deployment in config/webhook-server, not the manager.
  selector:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/name: armadillo
