{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "armadillo.fullname" . }}-manager-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "armadillo.componentLabels" (list . "manager") | nindent 4 }}
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: metrics
  selector:
    {{- include "armadillo.selectorLabels" (list . "manager") | nindent 4 }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "armadillo.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "armadillo.componentLabels" (list . "manager") | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
  - path: /metrics
    port: https
    scheme: https
    {{- with .Values.metrics.serviceMonitor.interval }}
    interval: {{ . }}
    {{- end }}
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      # The manager serves metrics with a self-signed certificate.
      insecureSkipVerify: true
  selector:
    matchLabels:
      {{- include "armadillo.selectorLabels" (list . "manager") | nindent 6 }}
{{- end }}
{{- end }}
