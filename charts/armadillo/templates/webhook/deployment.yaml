apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "armadillo.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "armadillo.componentLabels" (list . "webhook") | nindent 4 }}
spec:
  replicas: {{ .Values.webhook.replicas }}
  selector:
    matchLabels:
      {{- include "armadillo.selectorLabels" (list . "webhook") | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: webhook
        {{- with .Values.webhook.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "armadillo.componentLabels" (list . "webhook") | nindent 8 }}
        {{- with .Values.webhook.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "armadillo.webhookServiceAccount" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: webhook
        # The same image as the manager: it holds /manager and /webhook.
        image: {{ include "armadillo.image" (list . .Values.manager.image) }}
        imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
        command:
        - /webhook
        args:
        - --health-probe-bind-address=:8081
        - --loader-port={{ .Values.loader.gatePort }}
        - --gate-image={{ include "armadillo.image" (list . .Values.gate.image) }}
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        {{- with .Values.webhook.extraArgs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.webhook.resources | nindent 10 }}
        volumeMounts:
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: webhook-certs
        secret:
          secretName: {{ include "armadillo.webhookCertSecret" . }}
      {{- with .Values.webhook.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.webhook.affinity }}
        {{- toYaml .Values.webhook.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "armadillo.selectorLabels" (list . "webhook") | nindent 18 }}
        {{- end }}
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "armadillo.webhookService" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "armadillo.componentLabels" (list . "webhook") | nindent 4 }}
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: webhook-server
  selector:
    {{- include "armadillo.selectorLabels" (list . "webhook") | nindent 4 }}
{{- if .Values.webhook.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "armadillo.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "armadillo.componentLabels" (list . "webhook") | nindent 4 }}
spec:
  minAvailable: {{ .Values.webhook.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "armadillo.selectorLabels" (list . "webhook") | nindent 6 }}
{{- end }}
