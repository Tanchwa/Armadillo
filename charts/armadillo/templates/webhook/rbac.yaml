apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "armadillo.webhookServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "armadillo.componentLabels" (list . "webhook") | nindent 4 }}
  {{- with .Values.webhook.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Mirrors config/webhook-server/rbac.yaml. The webhook reads ProfileBindings
# and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "armadillo.fullname" . }}-webhook
  labels:
    {{- include "armadillo.componentLabels" (list . "webhook") | nindent 4 }}
rules:
- apiGroups:
  - armadillo.andrewsutliff.com
  resources:
  - profilebindings
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "armadillo.fullname" . }}-webhook
  labels:
    {{- include "armadillo.componentLabels" (list . "webhook") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "armadillo.fullname" . }}-webhook
subjects:
- kind: ServiceAccount
  name: {{ include "armadillo.webhookServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
