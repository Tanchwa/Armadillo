name: Docker Image CI

on:
  push:
    branches:
      - main
    paths:
      - '**/**'
  workflow_dispatch:
  
jobs:

  build:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image
      working-directory: .
      run: | 
        docker build . --file Dockerfile --tag tanchwa/armadillo-manager:latest && \
        docker build . --file Dockerfile.gate --tag tanchwa/armadillo-gate:latest && \
        docker build . --file Dockerfile.loader --tag tanchwa/armadillo-loader:latest
    - name: Push the Docker image
      run: docker login -u tanchwa -p ${{ secrets.DOCKER_TOKEN }} && docker push tanchwa/todoist-reclaim-webhook:latest
