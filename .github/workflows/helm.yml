name: Helm

on:
  push:
  pull_request:

permissions: {}

jobs:
  chart:
    permissions:
      contents: read
    name: Lint and verify the chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Helm is preinstalled on GitHub's Ubuntu runners.
      - name: Show Helm version
        run: helm version

      - name: Check the chart is in sync with the markers and values.yaml
        run: make helm-verify

      - name: Lint and render the chart
        run: make helm-lint
